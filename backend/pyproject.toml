[project]
name = "dietsheet-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Form models containing UploadFile (MealIn) are tested on 0.143.
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "pillow>=10.4,<12",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Include subpackages such as app.meals once features are split into packages.
include = ["app*"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic"]
