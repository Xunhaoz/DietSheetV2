[project]
name = "dietsheet-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Form models containing UploadFile (MealIn) are tested on 0.143.
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "pillow>=10.4,<12",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Include subpackages such as app.meals once features are split into packages.
include = ["app*"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

# Architecture rules from doc/developer/backend/conventions.md, checked by `lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Feature layers: router > schemas > service > repository > models"
type = "layers"
containers = ["app.meals"]
layers = ["router", "schemas", "service", "repository", "models"]

[[tool.importlinter.contracts]]
name = "Services, repositories and domain code stay free of HTTP"
type = "forbidden"
source_modules = [
    "app.meals.service",
    "app.meals.repository",
    "app.meals.models",
    "app.media",
    "app.core.config",
    "app.core.db",
    "app.core.errors",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "core does not depend on features"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.accounts", "app.meals", "app.media"]

[[tool.importlinter.contracts]]
name = "Shared features do not depend on meals"
type = "forbidden"
source_modules = ["app.accounts", "app.media"]
forbidden_modules = ["app.meals"]

[[tool.importlinter.contracts]]
name = "Shared features are independent of each other"
type = "independence"
modules = ["app.accounts", "app.media"]
