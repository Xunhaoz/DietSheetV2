# Minimal upload stack: api + PostgreSQL + SeaweedFS mini.
# Copy .env.example to .env and fill in the secrets before `docker compose up`.

x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://dietsheet:${POSTGRES_PASSWORD}@db:5432/dietsheet
    S3_ENDPOINT_URL: http://objects:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: diet-media
    OWNER_ID: ${OWNER_ID}
    API_TOKEN: ${API_TOKEN}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dietsheet
      POSTGRES_USER: dietsheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietsheet -d dietsheet"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  objects:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # One process runs master, volume, filer and S3; only S3 is used, on the private network.
    command: ["mini", "-dir=/data", "-ip=objects", "-ip.bind=0.0.0.0", "-admin.ui=false"]
    environment:
      # Registers the admin S3 identity; requests signed with other keys are rejected.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      objects:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  object-data:
