# Fast backend checks before each commit. Install once with: cd backend && uv run pre-commit install
# Tests need Docker and run in scripts/ci.sh instead.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: lint-imports
        name: architecture rules
        entry: uv run --directory backend lint-imports
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
